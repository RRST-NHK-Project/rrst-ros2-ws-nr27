# NR27 TR 独ステ1ユニットの試験用設定 (ノード名がキー)
# 【仮置き】と書いた値は実機で必ず合わせること。

tr_swerve_kinematics:
  ros__parameters:
    module_x: 0.25       # 【仮置き】ロボット中心からの位置 [m] (前が+)
    module_y: 0.25       # 【仮置き】(左が+)
    steer_limit: 3.14159  # ステアの可動範囲 ±[rad] (配線ねじれ防止。pi/2以上)

tr_steer_dm2325:
  ros__parameters:
    device_id: 205       # ros2can MODE_DAMIAO の DEVICE_ID (CAN線はDamiao専用)
    #                      TR の操舵の ESP32 (ros2can generated_firmware/tr_damiao_205)。BR は 201
    motor_index: 0       # config.hpp の DAMIAO_MOTORS の行 (0始まり)。tr_damiao_205 は1行目が操舵
    gear_ratio: 1.0      # 【仮置き】出力軸→ステア軸の減速比。直結なら1.0
    sign: 1              # 【仮置き】DMの+回転でステアが反時計回りなら1、逆なら-1
    offset_rad: 0.0      # 車輪が前を向くときのDM位置 [rad, 出力軸]
    #                      ros2 service call /steer/set_zero std_srvs/srv/Trigger
    #                      で今の向きを登録できる (値はログに出る。保存はされない)
    vel_limit: 5.0       # 移動速度の上限 [rad/s, 出力軸] 初回は控えめ (ファーム上限45.6)
    # 原点合わせ (起動直後に自動。やり直し: ros2 service call /steer/home std_srvs/srv/Trigger)
    # 操舵を回してフォトセンサのフラグを往復で探し、フラグの中心を原点にする
    home_on_start: true  # false なら原点合わせをせず offset_rad を使う
    flag_arc_mm: 64.01   # フラグ (センサを遮る円弧) の長さ [mm]
    flag_diameter_mm: 163.0  # フラグが付いている円の直径 [mm] → 幅 45°
    flag_center_rad: 0.0  # 【仮置き】フラグの中心にいる時のステア角 [rad] (前 = 0、反時計回り +)
    homing_vel: 1.0      # 原点合わせの速さ [rad/s, 出力軸] (約57°/s)
    homing_direction: 1  # 最初に回す向き (+1 / -1)
    homing_sweep_turns: 1.3  # フラグを探して回す最大量 [周, ステア軸]
    homing_width_tolerance: 0.3  # 測ったフラグ幅の許容誤差 (割合)
    homing_timeout: 30.0  # [s]

tr_drive_735:
  ros__parameters:
    device_id: 1         # 【仮置き】ros2can CAN_HOST の DEVICE_ID
    tx_slot: 0           # MES基板 MD1 (ノード番号*5+0)
    rx_slot: 1           # MES基板 ENC1 (ノード番号*5+1)
    wheel_radius: 0.05   # 【仮置き】[m]
    counts_per_rev: 1024.0  # 【仮置き】車輪1回転のENCカウント (PCNTは1逓倍)
    duty_sign: 1         # 【仮置き】+dutyで前進なら1
    encoder_sign: 1      # 【仮置き】前進でカウントが増えるなら1
    duty_max: 255.0      # MD_PWM_MAX (8bit)

# 駆動の速度制御 (setpoint=drive/speed_target, measurement=drive/speed, output=drive/duty)
tr_pid:
  ros__parameters:
    kff: 127.5           # 【仮置き】目標速度1 m/s あたりのduty (= 255 / 最高速度2.0m/s)
    kp: 0.0              # 初めは0 (フィードフォワードだけ)。エンコーダが合ってから上げる
    ki: 0.0
    kd: 0.0
    integral_limit: 50.0  # 【仮置き】I 項の上限 [duty]。引っかかって溜まった I 項で飛び出さないように
    output_limit: 255.0
