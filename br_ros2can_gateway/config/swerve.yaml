# 4輪独立ステアの値（SW-44。dev_ws の docs/control.md）。軌道生成（SW-45）・追従器（SW-48）・シムのモジュール模型（SW-47）が
# 同じ値を読む（scripts/swerve.py の load）。
# **どれも仮（未確認）**：機体幅（SW-31）と足回りの試作で決まり、実機で測って置き換える（SW-50）。
# 単位は SI（m・rad・s）。座標は base_link（x 前・y 左）。

# モジュールの位置 [m]。番号は 0 左前・1 左後・2 右後・3 右前。仮（未確認）
modules:
  - [0.15, 0.15]
  - [-0.15, 0.15]
  - [-0.15, -0.15]
  - [0.15, -0.15]

# 車輪の最高周速 [m/s]。2026-11-14 に 2.0 → 1.25（担当者）。実機の値からの換算：DM3519 の出力軸 45.1 rad/s（ファームの上限 45.6 rad/s）
# × 車輪側のギア 23/33（減速と読んだ。機構班に確かめる）× 車輪の半径 0.04 m ＝ 1.26 m/s（dev_ws の docs/control.md の「返ってきた値」）。
# 2026-10-29〜11-13 は 2.0（担当者：4輪独立ステアの平均的な速さ、仮の値）だった。上限が変わったら dev_ws の nav2_omni.yaml・follow.yaml と揃えて替える
wheel_speed_max: 1.25
# ステアの最高角速度 [rad/s]。仮（未確認）。90° を 0.52 s で回す
steer_rate_max: 3.0
# ステア角の範囲 [rad]。null は制限なし（全周回る）。±135° = 2.356（2026-11-18 担当者、dev_ws の決定事項62）。
# 機構は無限旋回だが、今のファームでは範囲を外せない。±135° は BLDC 担当の勧めで、安全装置（ステア軸 ±190°）まで 55° の余裕がある
steer_range: 2.356
# 機体がこれより速いとき、範囲の端に近づいた対角の2輪を先に振り直す [m/s]。0 は先に振り直さない。
# 仮の値（2026-11-19、hw:=fake の通しで決めた）。4輪が同時に端へ着くと減速できず、ゴールを行き過ぎて壁へ寄った。
# 先に振り直す形は 2026-11-22 に担当者が採った（dev_ws の決定事項64）。戻すときは 0
steer_early_speed: 0.3
# 端までの余裕がこれを切った対角の2輪を、止まる前に反対側の向きへ振り直す [rad]。仮の値（2026-11-19）。
# _drift は機体が回っていてタイヤの向きが流れる向きが分かるとき（流れる側の端までの余裕で比べる）
steer_early_room: 0.5236        # 30°
steer_early_room_drift: 1.3090  # 75°（2026-11-21 担当者が据え置いた）

# 機体の上限。加速度・角速度は仮（未確認）。いまの Nav2（MPPI Omni の vx・vy 1.25 / wz 1.5、velocity_smoother の加速度 1.5）に合わせた
# 速度は 2026-11-14 に 2.0 → 1.25（車輪と同じ）。加速度・角速度は変えていない
speed_max: 1.25         # 速度ノルム [m/s]
accel_max: 1.5          # 加速度ノルム [m/s^2]
omega_max: 1.5          # 角速度 [rad/s]
alpha_max: 3.0          # 角加速度 [rad/s^2]

# これより遅い車輪はステア角を今のまま保つ [m/s]（向きが定まらず振れるため）
wheel_stop: 0.001
