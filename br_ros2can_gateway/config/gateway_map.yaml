# 仲介ノードの割り当て表（SW-65、dev_ws の決定事項58・60。dev_ws の docs/control.md の「実機との接続層」）。
# BR のソフトの物理量（ステア角 δ [rad]・車輪の速さ s [m/s]）と、ros2can の serial_tx_[ID]・serial_rx_[ID]
# （Int16 を24個）の対応を、この1枚に持つ。読むのは scripts/gateway_map.py だけ。
# モータの機種・ID・ギア比が変わったら、ここだけを直す。
#
# スロットの並び（MODE_DAMIAO、1台6個。原本は ros2can の firmware/xiao-esp32-s3_can2io/src/damiao.cpp の頭のコメント）：
#   指令 +0 モード（0 脱力・1 速度・2 角度） +1 目標（速度 0.01 rad/s・角度 0.001 rad） +2 角度制御の速さの上限（0.01 rad/s）
#   帰還 +0 状態（0 脱力・1 有効・15 ESP32 が止めている・ほかは故障） +1 返事の回数 +2 内部の位置（0.1 rad、不明は -32768）
#        +3 位置（0.001 rad、±12.5 rad で折り返す） +4 速度（0.01 rad/s） +5 トルク（0.001 N·m）

# 指令を送る周期 [Hz]。ros2can の tx_watchdog_sec（0.2 s）より十分短くする（50 Hz 以上）
rate_hz: 50.0
# 上流（/drive/module_cmd）がこの時間来なければ止める [s]
cmd_timeout: 0.2
# 帰還（serial_rx_[ID]）がこの時間来なければ止める [s]
fb_timeout: 0.2

# 車輪の半径 [m]（直径 80 mm、機構班の返事）
wheel_radius: 0.04

drive:                # 駆動（DM3519、速度制御）
  gear: 1.434783      # 出力軸の回転 ÷ 車輪の回転（33/23。車輪 = 出力軸 × 23/33 の減速。機構班の返事 2026-11-18）
  vel_max: 45.6       # 出力軸の速さの上限 [rad/s]（ファームの DAMIAO_MAX_VEL_RADPS）

steer:                # ステア（DM2325、角度制御）
  gear: 3.769231      # モータの回転 ÷ ステア軸の回転（49/13。BLDC 担当の 3.77）
  vel_limit: 30.0     # 角度制御の速さの上限 [rad/s]（モータ側。KP_APR 270・ACC/DEC 5/-5 とセットの値）
  # 角度制御で送ってよい位置の範囲 [rad]（ESC の内部の位置で守る）。±135° × 49/13 = 8.88 rad（BLDC 担当の勧め、2026-11-18 担当者が決めた）。
  # ファームの安全装置は ±12.5 rad（ステア軸 ±190°）で脱力する。行き過ぎは最悪 22°、電源投入時の向きのずれは 30° 程度まで収まる
  pos_limit: 8.88

# 駆動の暴走の見張り（BLDC 担当の返事、2026-11-18）。11/9 に DM3519 が指令と逆向きに全速（約 -40 rad/s）で回り続け、
# 故障コードも ESP32 のラッチも出なかった。原因は未解明。値はどれも出力軸の rad/s で、11/19 の実測で決める
runaway:
  reverse_diff: 10.0  # 実際の速度が指令と逆向き（指令がほぼ 0、同じ向きで指令より速い、を含む）で、差がこの値以上（BLDC 担当の例）
  over_speed: 5.0     # 実際の速度が上限（drive.vel_max）をこの値以上超える（BLDC 担当の例）
  hold: 0.3           # この時間続いたら脱力して、次の合図まで止めたままにする [s]（BLDC 担当の例）
  shrink: 5.0         # 続いている間に差がこの値以上縮んだら、ふつうの加減速とみなして数え直す（仮の値。ESC の ACC 2 では 0.3 s で約 31 rad/s 縮む）

# ros2can のデバイス ID（serial_tx_[ID]・serial_rx_[ID] の [ID]）
devices:
  steer: 201          # ESP32（MODE_DAMIAO）：ステア4台
  drive: 204          # ESP32（MODE_DAMIAO）：駆動4台（BLDC 担当の案。202 は ros2can の RobStride の既定値と同じなので避ける）
  inputs: 101         # 入力用の ESP32（CAN ホスト）：フォトセンサ・測定輪・機体の入力

# ESC の番号（ファームの DAMIAO_MOTORS に書く。BLDC 担当の案、2026-11-18 担当者が決めた）：ESC_ID は 15 以下、MST_ID は 0x21〜
#   モジュール 0 左前・1 左後・2 右後・3 右前 の順に、ステア 1〜4（MST 0x21〜0x24）、駆動 5〜8（MST 0x25〜0x28）
# モータごとの行。module は swerve.yaml の番号（0 左前・1 左後・2 右後・3 右前）、
# index はその ESP32 の中で何台目か（0〜3。スロットは index × 6 から）、sign は回る向き（+1 か -1）。
# home はフォトセンサが切り替わる所のステア角 [rad]（機構の取り付けで決まる）
motors:
  steer:
    - {module: 0, index: 0, sign: 1, home: 0.0}
    - {module: 1, index: 1, sign: 1, home: 0.0}
    - {module: 2, index: 2, sign: 1, home: 0.0}
    - {module: 3, index: 3, sign: 1, home: 0.0}
  drive:
    - {module: 0, index: 0, sign: 1}
    - {module: 1, index: 1, sign: 1}
    - {module: 2, index: 2, sign: 1}
    - {module: 3, index: 3, sign: 1}

# 入力用の ESP32 の口（[ノード, 入力の番号]。null は未定）。中身は SW-69（測定輪）・SW-71（機体の入力）で決める
# スイッチ（start・team・estop・freeze）は [CAN バスのノード 1〜4, SW 1〜3]。ros2can の CAN ホストのプロファイルの既定で、
# ノード n の SW k はスロット (n − 1) × 5 ＋ (k − 1)（gateway_map.switch_slot）
inputs:
  start: [1, 1]       # スタートスイッチ。仮（シムの模擬で通すための置き場所。基板担当と決める）
  team: [1, 2]        # 陣営スイッチ（2位置）。仮（同上、2026-11-25）
  estop: [1, 3]       # 配線の非常停止ボタンの状態（押している間ずっと）。仮（同上）
  freeze: [2, 1]      # フリーズ／再開の受信機の出力（止めろの間ずっと）。仮（同上。ノード 1 は SW が3つまでなのでノード 2）
  photo: [null, null, null, null]   # ステアの原点のフォトセンサ（モジュール 0〜3）
  enc: [null, null, null]           # 測定輪のエンコーダ

# 入力の読み方（SW-71、2026-11-25。どれも仮＝基板担当・担当者と決める）
input_rules:
  team_on: blue       # 陣営スイッチが 1（閉じている）のときの陣営。0 のときは反対の陣営
  estop_on: 0         # 非常停止のボタンが押されているときの読み。0 はノーマルクローズの接点（押す・線が切れると 0＝止める側）
  freeze_on: 1        # フリーズの受信機が「止めろ」を出しているときの読み
  debounce: 0.05      # 読みがこの間続いたら切り替わったと決める [s]（スタートスイッチと同じ値）
  lost: hold          # 入力の帰還が fb_timeout 来ないとき：ignore（何もしない）・hold（フリーズと同じく速度 0 で保ち、戻れば走る）・
                      # relax（脱力して次の合図まで止める）。**hold にした（2026-11-27 担当者）**：途切れている間はフリーズの受信機の
                      # 「止めろ」を読めないので走らせない。脱力しないのでランプの上でも下がらない。それまでは ignore

# 仮の値（実機で確かめていない・他班と決めていない）。1つでも残っている間は、実機の形（hw:=real）では起動しない。
# 決まった行をここから消す
provisional:
  - devices.inputs    # 入力用の ESP32 の DEVICE_ID（基板担当）
  - motors.sign       # 回る向き（実機で確かめる）
  - motors.home       # フォトセンサの位置（機構班）
  - inputs            # 入力の口（基板担当・機構班）
  - input_rules       # 入力の読みの向き・途切れたときの扱い（基板担当・担当者）
  - runaway           # 暴走の見張りのしきい値（BLDC 担当の 11/19 の実測で決める）
  - cmd_timeout       # ベンチで測って決める（SW-68）
  - fb_timeout        # 同上
